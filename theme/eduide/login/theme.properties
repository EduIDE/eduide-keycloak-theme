# EduIDE login theme.
#
# parent=base is deliberate. The base login theme ships NO theme.properties and
# no CSS at all, so every ${properties.kcXxxClass!} in the ~45 templates we
# inherit would resolve to an empty string. This file is therefore not an
# override - it fills a vacuum. Because every class hook Keycloak's own
# templates emit is named here, the pages we never touch (error, info,
# login-update-password, register, select-authenticator, ...) still render
# against our stylesheet, which is why this theme only overrides two templates.
#
# Every key below is referenced by at least one template in base/login.
# Verified against keycloak 26.4.0. Re-extract with the command in AGENTS.md
# ("Upstream facts") after a Keycloak upgrade - scripts/check-theme.sh fails the
# build if upstream starts using a key we have not defined here.

parent=base
import=common/keycloak
locales=en,de
styles=css/login.css
meta=viewport==width=device-width,initial-scale=1

# 26.1+ exposes a `darkMode` template variable gated on this property AND the
# realm attribute of the same name. Our template uses (darkMode!true) so 26.0,
# where the variable does not exist, still gets dark mode.
darkMode=true

## Document chrome ------------------------------------------------------------
kcHtmlClass=eduide-html
kcBodyClass=eduide-body
kcLoginClass=eduide-page
kcHeaderClass=eduide-page__header
kcHeaderWrapperClass=eduide-page__header-text
kcFormCardClass=eduide-card
kcFormHeaderClass=eduide-card__header
kcContentWrapperClass=eduide-content
kcMarginTopClass=eduide-mt
kcSignUpClass=eduide-signup
kcInfoAreaWrapperClass=eduide-info

## Form skeleton --------------------------------------------------------------
kcFormClass=eduide-form
kcFormGroupClass=eduide-field
kcFormSettingClass=eduide-form__settings
kcFormOptionsClass=eduide-form__options
kcFormOptionsWrapperClass=eduide-form__options-inner
kcFormButtonsClass=eduide-form__buttons
kcFormButtonsWrapperClass=eduide-form__buttons-inner

## Inputs ---------------------------------------------------------------------
kcLabelClass=eduide-label
kcLabelWrapperClass=eduide-label-wrap
kcInputClass=eduide-input
kcTextareaClass=eduide-input eduide-input--textarea
kcInputWrapperClass=eduide-input-wrap
kcInputGroup=eduide-input-group
kcInputErrorMessageClass=eduide-error
kcInputHelperTextBeforeClass=eduide-helper eduide-helper--before
kcInputHelperTextAfterClass=eduide-helper eduide-helper--after

## Checkboxes and radios ------------------------------------------------------
# kcCheckboxInputClass is what register-commons.ftl puts on the consent
# checkbox itself. If it were empty the privacy consent control would be a bare
# unstyled browser checkbox in an otherwise branded form.
kcCheckboxInputClass=eduide-check__input
kcCheckInputClass=eduide-check__input
kcInputClassCheckbox=eduide-check
kcInputClassCheckboxInput=eduide-check__input
kcInputClassCheckboxLabel=eduide-check__label
kcInputClassRadio=eduide-check eduide-check--radio
kcInputClassRadioInput=eduide-check__input
kcInputClassRadioLabel=eduide-check__label
kcInputClassRadioCheckboxLabelDisabled=is-disabled

## Buttons --------------------------------------------------------------------
# kcButtonLargeClass is referenced 53x upstream and deliberately left empty:
# EduIDE buttons have one size, so an empty value is the correct no-op.
kcButtonClass=eduide-btn
kcButtonPrimaryClass=eduide-btn--primary
kcButtonDefaultClass=eduide-btn--secondary
kcButtonSecondaryClass=eduide-btn--secondary
kcButtonBlockClass=eduide-btn--block
kcButtonLargeClass=

## Alerts ---------------------------------------------------------------------
# base/login/template.ftl also hardcodes `pf-c-alert__icon` and
# `pf-m-danger|success|warning|info`; login.css styles those literals too.
kcAlertClass=eduide-alert
kcAlertTitleClass=eduide-alert__title
kcFeedbackErrorIcon=eduide-icon eduide-icon--error
kcFeedbackWarningIcon=eduide-icon eduide-icon--warning
kcFeedbackSuccessIcon=eduide-icon eduide-icon--success
kcFeedbackInfoIcon=eduide-icon eduide-icon--info

## Password visibility --------------------------------------------------------
# MUST stay non-empty. base/login/resources/js/passwordVisibility.js assigns
# these strings straight onto the <i> element's className, so an empty value
# leaves an invisible dead control next to every password field.
kcFormPasswordVisibilityButtonClass=eduide-btn eduide-btn--icon
kcFormPasswordVisibilityIconShow=eduide-icon eduide-icon--eye
kcFormPasswordVisibilityIconHide=eduide-icon eduide-icon--eye-off

## Misc icons used by inherited templates -------------------------------------
kcResetFlowIcon=eduide-icon eduide-icon--restart
kcWebAuthnKeyIcon=eduide-icon eduide-icon--key
kcWebAuthnDefaultIcon=eduide-icon eduide-icon--key

## Locale switcher ------------------------------------------------------------
kcLocaleMainClass=eduide-locale
kcLocaleWrapperClass=eduide-locale__wrap
kcLocaleDropDownClass=eduide-locale__dropdown
kcLocaleListClass=eduide-locale__list
kcLocaleListItemClass=eduide-locale__item
kcLocaleItemClass=eduide-locale__link

## Identity providers ---------------------------------------------------------
# Not a designed feature of this theme, but a deployment that federates its own
# SSO must not get unstyled buttons.
kcFormSocialAccountSectionClass=eduide-social
kcFormSocialAccountListClass=eduide-social__list
kcFormSocialAccountListGridClass=eduide-social__list--grid
kcFormSocialAccountGridItem=eduide-social__grid-item
kcFormSocialAccountListButtonClass=eduide-btn eduide-btn--secondary eduide-btn--block
kcFormSocialAccountListButtonDisabledClass=is-disabled
kcFormSocialAccountNameClass=eduide-social__name
kcCommonLogoIdP=eduide-social__logo

## select-authenticator.ftl ---------------------------------------------------
kcSelectAuthListClass=eduide-authlist
kcSelectAuthListItemClass=eduide-authlist__item
kcSelectAuthListItemIconClass=eduide-authlist__icon
kcSelectAuthListItemIconPropertyClass=eduide-authlist__icon-glyph
kcSelectAuthListItemBodyClass=eduide-authlist__body
kcSelectAuthListItemHeadingClass=eduide-authlist__heading
kcSelectAuthListItemDescriptionClass=eduide-authlist__desc
kcSelectAuthListItemFillClass=eduide-authlist__fill
kcSelectAuthListItemArrowClass=eduide-authlist__arrow
kcSelectAuthListItemArrowIconClass=eduide-icon eduide-icon--chevron
kcSelectAuthListItemTitle=eduide-authlist__title

## OTP and recovery codes -----------------------------------------------------
kcLoginOTPListClass=eduide-otp
kcLoginOTPListInputClass=eduide-otp__input
kcLoginOTPListItemHeaderClass=eduide-otp__header
kcLoginOTPListItemIconBodyClass=eduide-otp__icon-wrap
kcLoginOTPListItemIconClass=eduide-icon eduide-icon--mobile
kcLoginOTPListItemTitleClass=eduide-otp__title
