# EduIDE login theme - German.
# See messages_en.properties for the three escaping rules. They apply here too,
# and German text is where rule 1 usually bites, so keep avoiding apostrophes.
# Umlauts are written directly: Keycloak reads these bundles as UTF-8.

# --- Consent ---------------------------------------------------------------
# Placeholder, same reasoning as the English bundle. A realm that overrides
# only the English text still serves THIS text to German users, because
# Keycloak resolves overrides per locale: realm-de beats theme-de beats
# realm-en beats theme-en.
termsTitle=Datenschutz
termsText=<p><strong>Für diese Installation wurde noch keine Datenschutzerklärung hinterlegt.</strong></p><p>Der Betreiber dieses Dienstes ersetzt diesen Text vor dem produktiven Einsatz durch die für Sie geltende Datenschutzerklärung.</p>
