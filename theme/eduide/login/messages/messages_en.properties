# EduIDE login theme - English.
#
# THREE ESCAPING RULES. Breaking any of them corrupts the rendered page and
# Keycloak reports nothing:
#
#   1. Every value is passed through java.text.MessageFormat, even when it
#      takes no arguments. Write '' for a literal apostrophe and '{' '}' for
#      literal braces. Values here deliberately avoid apostrophes entirely.
#   2. ${...} inside a value is substituted from system properties and
#      environment variables before formatting. Never use it.
#   3. Values rendered through kcSanitize may only use the OWASP-allowed
#      elements - p, h1-h6, ul, ol, li, a, strong, em, br, div, span and
#      friends. <details>, <section>, <button>, <form> and <script> are
#      stripped silently, and every <a> gains rel="nofollow".
#
# scripts/check-messages.sh enforces 1 and 2 and that this file and
# messages_de.properties define the same keys.

# --- Consent ---------------------------------------------------------------
# termsTitle, termsText and acceptTerms are read by BOTH consent surfaces:
# terms.ftl (the TERMS_AND_CONDITIONS required action) and the stock
# register-commons.ftl macro (the in-form checkbox).
#
# termsText below is a PLACEHOLDER and is meant to be replaced per deployment.
# It deliberately makes no statement about who controls the data, because a
# statement naming the wrong controller is worse than an obvious placeholder.
# Replace it WITHOUT rebuilding this theme by setting realm localization
# overrides - see docs/customising.md. Override every locale the realm has
# enabled, not just English.
termsTitle=Data protection
termsText=<p><strong>This deployment has not published its data protection statement yet.</strong></p><p>The operator of this service is expected to replace this text with the statement that applies to you before the service is used in production.</p>
acceptTerms=I have read and agree to the data protection statement
acceptTermsHelp=You need to agree before you can continue.
termsAcceptanceRequired=Please confirm that you agree to the data protection statement.

# --- Footer ----------------------------------------------------------------
# Each link renders only when its URL value is non-empty, so the default is a
# clean footer rather than dead links. Nothing here may name an institution.
footerImprintUrl=
footerImprintLabel=Imprint
footerPrivacyUrl=
footerPrivacyLabel=Privacy
footerHelpUrl=
footerHelpLabel=Help

# --- Accessibility ---------------------------------------------------------
# base/login/template.ftl sets aria-label="${msg("languages")}" on the locale
# switcher, but no base bundle defines `languages` - upstream therefore
# announces the literal string "languages" to screen readers. Defined here.
languages=Change language
